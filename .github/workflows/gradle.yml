name: Java CI with Gradle

on:
  push:
    branches: [ "main", "load-generator-kip-1123" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    - name: Execute Gradle build
      run: ./gradlew build
    - name: Determine image tag
      id: image-tag
      run: |
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "tag=latest" >> $GITHUB_OUTPUT
        else
          BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/heads\///')
          echo "tag=$BRANCH_NAME" >> $GITHUB_OUTPUT
        fi
    - name: Execute Gradle jib
      if: github.event_name == 'push'
      env:
        ORG_GRADLE_PROJECT_imageUsername: ${{ github.actor }}
        ORG_GRADLE_PROJECT_imagePassword: ${{ secrets.GITHUB_TOKEN }}
        ORG_GRADLE_PROJECT_imageTag: ${{ steps.image-tag.outputs.tag }}
      run: ./gradlew jib
